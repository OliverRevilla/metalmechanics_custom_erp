name: Dev CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare ephemeral Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/.secrets deployment/backups deployment/reports
          printf 'ci-db-root-%s\n' "$GITHUB_RUN_ID" > deployment/.secrets/db_root_password
          printf 'ci-admin-%s\n' "$GITHUB_RUN_ID" > deployment/.secrets/admin_password
          printf 'MARIADB_IMAGE=%s\n' "$(jq -r '.images.mariadb' deployment/locks/images.json)" > deployment/.env
          printf 'REDIS_IMAGE=%s\n' "$(jq -r '.images.redis' deployment/locks/images.json)" >> deployment/.env
          printf 'SITE_NAME=metalmecanica.localhost\nCUSTOM_IMAGE=metalmecanica-erp:ci-dev\n' >> deployment/.env

      - name: Build pinned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64
          tags: metalmecanica-erp:ci-dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Validate image and Compose
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /home/frappe/frappe-bench/env/bin/python metalmecanica-erp:ci-dev -m compileall -q /opt/metalmecanica/scripts /opt/metalmecanica/tests
          docker image inspect metalmecanica-erp:ci-dev --format '{{.Id}}'
          docker compose --env-file deployment/.env -f deployment/docker-compose.yml -f deployment/config/compose.dev.yml config --quiet
