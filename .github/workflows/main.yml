name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare ephemeral Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment/.secrets deployment/backups deployment/reports
          printf 'ci-db-root-%s\n' "$GITHUB_RUN_ID" > deployment/.secrets/db_root_password
          printf 'ci-admin-%s\n' "$GITHUB_RUN_ID" > deployment/.secrets/admin_password
          printf 'MARIADB_IMAGE=%s\n' "$(jq -r '.images.mariadb' deployment/locks/images.json)" > deployment/.env
          printf 'REDIS_IMAGE=%s\n' "$(jq -r '.images.redis' deployment/locks/images.json)" >> deployment/.env
          printf 'SITE_NAME=metalmecanica.localhost\nCUSTOM_IMAGE=metalmecanica-erp:ci-main\n' >> deployment/.env

      - name: Build release candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64
          tags: metalmecanica-erp:ci-main
          load: true
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main

      - name: Validate Compose and image metadata
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file deployment/.env -f deployment/docker-compose.yml config --quiet
          docker run --rm --entrypoint /home/frappe/frappe-bench/env/bin/python metalmecanica-erp:ci-main -m compileall -q /opt/metalmecanica/scripts /opt/metalmecanica/tests
          docker image inspect metalmecanica-erp:ci-main --format '{{json .Config.Labels}}' | tee deployment/reports/ci-image-labels.json

      - name: Publish candidate metadata
        uses: actions/upload-artifact@v4
        with:
          name: metalmecanica-main-image-metadata
          path: deployment/reports/ci-image-labels.json
          if-no-files-found: error
